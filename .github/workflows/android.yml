name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      # Pushes to main already passed the maintainer's local full CI (pre-push hook), so they only
      # check that a clean checkout compiles. Pull requests and release tags also run the unit tests.
      - name: Debug build (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash ./gradlew assembleDebug --console=plain
      - name: Unit tests and debug build
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: bash ./gradlew testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: feiyu-notes-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FEIYU_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/feiyu.jks"
      - name: Build signed release APK
        env:
          FEIYU_KEYSTORE: ${{ runner.temp }}/feiyu.jks
          FEIYU_KEY_PASSWORD: ${{ secrets.FEIYU_KEY_PASSWORD }}
        run: |
          bash ./gradlew assembleRelease --no-configuration-cache --console=plain
          test "$(apkanalyzer manifest debuggable app/build/outputs/apk/release/app-release.apk)" = "false"
          cp app/build/outputs/apk/release/app-release.apk "feiyu-notes-${GITHUB_REF_NAME}.apk"
      - name: Publish early release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "feiyu-notes-${GITHUB_REF_NAME}.apk" \
            --verify-tag --prerelease --title "肥鱼笔记 ${GITHUB_REF_NAME}" --notes-file .github/release-notes.md
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/feiyu.jks"
